name: Update live tenders

on:
  schedule:
    - cron: '17 5 * * *'    # daily, 06:17 UK summer time (05:17 in winter)
    - cron: '17 11 * * *'   # back-up run, in case GitHub skips the early one
    - cron: '17 17 * * *'   # second back-up run
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-tenders
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch open tenders from Find a Tender
        run: node fetch-tenders.mjs
      - name: Save if anything changed
        run: |
          git config user.name "shortlist-bot"
          git config user.email "actions@users.noreply.github.com"
          git add tenders.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update live tenders"
            git push
          fi
